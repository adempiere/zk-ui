
services:
  adempiere-db:
    build:
      context: postgresql/
      dockerfile: Dockerfile
    container_name: ${POSTGRES_NAME}
    restart: ${GENERIC_RESTART}
    ports:
      - ${POSTGRES_PORT}
    volumes:
      - volume_postgres:/var/lib/postgresql/data
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/5432; exit $?;'"
      interval: 10s
      retries: 60
      start_period: 20s
      timeout: 10s
    environment:
      # TODO: Manage with secrets and not with environment variables
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - adempiere_network

  adempiere-zk:
    image: ${ADEMPIERE_ZK_IMAGE}
    container_name: ${ADEMPIERE_NAME}
    restart: ${GENERIC_RESTART}
    ports:
      - ${ADEMPIERE_ZK_PORT}:8080
    secrets:
      - adempiere_db_password
    environment:
      ADEMPIERE_DB_SERVER: ${POSTGRES_NAME}
      ADEMPIERE_DB_PASSWORD_FILE: /run/secrets/adempiere_db_password
    depends_on:
      adempiere-db:
        condition: service_healthy
    networks:
      - adempiere_network



networks:
  adempiere_network:
    name: ${ADEMPIERE_NETWORK}

volumes:
  volume_postgres:
    name: ${POSTGRES_NETWORK}

secrets:
  adempiere_db_password:
    file: ./secrets/adempiere_db_password.txt
